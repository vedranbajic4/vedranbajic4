<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="100%" stop-color="#25102a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; }
    .prompt { fill: #ec4899; font-weight: 700; }
    .path { fill: #a855f7; font-weight: 700; }
    .cmd { fill: #ffffff; }
    .out { fill: #d4d4d8; }
    .hl { fill: #f472b6; font-weight: 700; }
    .pu { fill: #c084fc; font-weight: 700; }
    .dim { fill: #71717a; }
    .title { fill: #a1a1aa; font-size: 13px; }
    .line { opacity: 0; animation: show 0.35s ease forwards; }
    @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .frame { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { stroke-opacity: 0.9; } 50% { stroke-opacity: 0.45; } }
  </style>

  <rect x="10" y="10" width="840" height="360" rx="16" fill="#0a0a0f" stroke="url(#border)" stroke-width="2.5" class="frame" filter="url(#glow)"/>
  <rect x="11.5" y="11.5" width="837" height="36" rx="15" fill="url(#bar)"/>
  <circle cx="38" cy="29" r="7" fill="#ec4899"/>
  <circle cx="60" cy="29" r="7" fill="#c084fc"/>
  <circle cx="82" cy="29" r="7" fill="#ffffff" fill-opacity="0.85"/>
  <text x="430" y="34" text-anchor="middle" class="title">vedran@novi-sad: ~ — zsh</text>

  <g class="line" style="animation-delay:0.3s">
    <text x="34" y="80"><tspan class="prompt">vedran@novi-sad</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>
  <g class="line" style="animation-delay:0.9s">
    <text x="34" y="104" class="out">Vedran Bajić — <tspan class="hl">Software Engineer</tspan> × <tspan class="pu">Mathematician</tspan> in the making</text>
  </g>

  <g class="line" style="animation-delay:1.6s">
    <text x="34" y="138"><tspan class="prompt">vedran@novi-sad</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">cat education.txt</tspan></text>
  </g>
  <g class="line" style="animation-delay:2.2s">
    <text x="34" y="162" class="out"><tspan class="hl">[FTN]</tspan>  Software Engineering      · Faculty of Technical Sciences   <tspan class="dim">2024 → 2028</tspan></text>
  </g>
  <g class="line" style="animation-delay:2.6s">
    <text x="34" y="186" class="out"><tspan class="pu">[PMF]</tspan>  Theoretical Mathematics   · Faculty of Sciences, Novi Sad   <tspan class="dim">2026 → 2028</tspan></text>
  </g>

  <g class="line" style="animation-delay:3.3s">
    <text x="34" y="220"><tspan class="prompt">vedran@novi-sad</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">ls ./interests</tspan></text>
  </g>
  <g class="line" style="animation-delay:3.9s">
    <text x="34" y="244" class="out"><tspan class="hl">backend/</tspan>  <tspan class="pu">algorithms/</tspan>  <tspan class="hl">web3/</tspan>  <tspan class="pu">parallel-computing/</tspan>  <tspan class="hl">game-ai/</tspan>  <tspan class="pu">proofs/</tspan></text>
  </g>

  <g class="line" style="animation-delay:4.6s">
    <text x="34" y="278"><tspan class="prompt">vedran@novi-sad</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">echo $MOTTO</tspan></text>
  </g>
  <g class="line" style="animation-delay:5.2s">
    <text x="34" y="302" class="out">"<tspan class="hl">Proofs</tspan> by day, <tspan class="pu">programs</tspan> by night. ∀ bug ∃ fix."</text>
  </g>

  <g class="line" style="animation-delay:5.9s">
    <text x="34" y="336"><tspan class="prompt">vedran@novi-sad</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan></text>
    <rect x="232" y="322" width="10" height="18" fill="#ec4899" class="cursor"/>
  </g>
</svg>
